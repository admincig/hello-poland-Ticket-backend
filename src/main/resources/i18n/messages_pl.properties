CannotGenerateQrCodeException=Kod QR nie mógł być wygenerowany.
EmailSendingException=Wystąpił problem przy wysyłaniu wiadomości email.
ImportingDataException=Wystąpił błąd przy importowaniu danych z pliku.

NoAvailableTicketsException=Brak dostępnych biletów na wybrane wydarzenie.
NotBookedException=Rezerwacja posiada status, który uniemożliwia zakup.
PunchingTicketForWrongSightException=Próba skasowania biletu odpowiadającego innej atrakcji.
TicketAlreadyPunchedException=Bilet został już wykorzystany i nie może być użyty ponownie.
TicketForAnotherDateException=Bilet jest na inny termin.
TicketInvalidException=Bilet jest nieważny. Odwiedzający nie może wejść.
WrongTicketStatusException=Bilet został wcześniej skasowany lub jest nieważny.

ResourceNotFoundException=Żądany zasób nie istnieje.
TicketNotFoundException=Bilet nie został odnaleziony w bazie danych.

NumberOfTicketsNotPositiveException=Liczba biletów do rezerwacji musi być dodatnia.