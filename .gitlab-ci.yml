stages:
  - test
  - build
  - docker
  - deploy

variables:
  JAVA_VERSION: "11"

Run tests:
  stage: test
  before_script:
    - . envcfg
    - envcfg -p
  script:
    - mvn clean test -DfailIfNoTests=false -Dtest=*Test,*Spec
  tags:
    - maven

Build for test server:
  stage: build
  before_script:
    - . envcfg
    - envcfg -p
  script:
    - mvn -Dlocal.maven.build.properties=${FRM_HPT_TEST_MAVEN_LOCAL_PROPERTIES_DIR} -Dmaven.test.skip=true clean package -U
    - docker build -t "${FRM_HPT_TEST_DOCKER_BACKEND_IMAGE}" .
    - docker push "${FRM_HPT_TEST_DOCKER_BACKEND_IMAGE}"
    - docker image rm "${FRM_HPT_TEST_DOCKER_BACKEND_IMAGE}"
  tags:
    - maven
  when: manual

Build for production server:
  stage: build
  before_script:
    - . envcfg
    - envcfg -p
  script:
    - mvn -Dlocal.maven.build.properties=${FRM_HPT_PROD_MAVEN_LOCAL_PROPERTIES_DIR} -Dmaven.test.skip=true clean package -U
    - docker build -t "${FRM_HPT_PROD_DOCKER_BACKEND_IMAGE}" .
    - docker push "${FRM_HPT_PROD_DOCKER_BACKEND_IMAGE}"
    - docker image rm "${FRM_HPT_PROD_DOCKER_BACKEND_IMAGE}"
  tags:
    - maven
  when: manual

Build for Wrocław ON production server:
  stage: build
  before_script:
    - . envcfg
    - envcfg -p
  script:
    - mvn -Dlocal.maven.build.properties=${FRM_HPT_PROD2_MAVEN_LOCAL_PROPERTIES_DIR} -Dmaven.test.skip=true clean package -U
    - docker build -t "${FRM_HPT_PROD2_DOCKER_BACKEND_IMAGE}" .
    - docker push "${FRM_HPT_PROD2_DOCKER_BACKEND_IMAGE}"
    - docker image rm "${FRM_HPT_PROD2_DOCKER_BACKEND_IMAGE}"
  tags:
    - maven
  when: manual

Deploy on test server:
  stage: deploy
  script:
    - docker-compose -p ${FRM_HPT_TEST_CONTAINER_NAME} pull
    - set +e && docker-compose -p ${FRM_HPT_TEST_CONTAINER_NAME} stop && set -e
    - docker-compose -p ${FRM_HPT_TEST_CONTAINER_NAME} up -d
  tags:
    - qs1-server
  when: manual

Deploy on Wrocław ON prod server:
  stage: deploy
  script:
#    - ${FRM_HPT_PROD_DB_DUMP_SCRIPT_DIR}
    - docker pull "${FRM_HPT_PROD2_DOCKER_BACKEND_IMAGE}"
    - docker ps -aq --filter "name=${FRM_HPT_PROD2_CONTAINER_NAME}" | grep -q . && docker stop "${FRM_HPT_PROD2_CONTAINER_NAME}" && docker rm "${FRM_HPT_PROD2_CONTAINER_NAME}"
    - docker run -d --network="bridge" -p ${FRM_HPT_PROD2_PORT}:8080 -v ${FRM_HPT_PROD2_LOCAL_RUNTIME_PROP_DIR}:/opt/local.runtime.properties --name "${FRM_HPT_PROD2_CONTAINER_NAME}" "${FRM_HPT_PROD2_DOCKER_BACKEND_IMAGE}"
  tags:
    - hpl-prod
  when: manual
