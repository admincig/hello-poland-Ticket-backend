stages:
  - sonarqube-check
  - build
  - deploy

variables:
  JAVA_VERSION: "21"
  MAVEN_VERSION: "3.9"
  TEST_IMAGE: docker.fream.pl/hello-poland/hpt/backend:_test_$CI_COMMIT_SHA
  PROD_IMAGE: docker.fream.pl/hello-poland/hpt/backend:_prod_$CI_COMMIT_SHA
  PROD2_IMAGE: docker.fream.pl/hello-poland/hpt/backend:_prod2_$CI_COMMIT_SHA
  TEST_CONTAINER_NAME: hpt_test
  PROD_CONTAINER_NAME: hello_ticket
  PROD2_CONTAINER_NAME: wroclaw_on_hpt

SonarQube analysis:
  stage: sonarqube-check
  image: maven:3-eclipse-temurin-21
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - mvn verify sonar:sonar -Dsonar.qualitygate.wait=true
  allow_failure: true
  only:
    - merge_requests
  tags:
    - ops03-docker-executor


Build for test server:
  stage: build
  before_script:
    - . envcfg
    - envcfg -p
  script:
    - mvn -Dlocal.maven.build.properties=${TEST_MAVEN_PROPERTIES} -Dmaven.test.skip=true clean package -U
    - docker build -t $TEST_IMAGE .
    - docker push $TEST_IMAGE
    - docker image rm $TEST_IMAGE
  tags:
    - maven
  when: manual

Build for production server:
  stage: build
  before_script:
    - . envcfg
    - envcfg -p
  script:
    - mvn -Dlocal.maven.build.properties=${PROD_HPT_MAVEN_PROPERTIES} -Dmaven.test.skip=true clean package -U
    - docker build -t $PROD_IMAGE .
    - docker push $PROD_IMAGE
    - docker image rm $PROD_IMAGE
  tags:
    - maven
  when: manual

Build for Wrocław ON production server:
  stage: build
  before_script:
    - . envcfg
    - envcfg -p
  script:
    - mvn -Dlocal.maven.build.properties=${PROD2_HPT_MAVEN_PROPERTIES} -Dmaven.test.skip=true clean package -U
    - docker build -t $PROD2_IMAGE .
    - docker push $PROD2_IMAGE
    - docker image rm $PROD2_IMAGE
  tags:
    - maven
  when: manual

Deploy on test server:
  stage: deploy
  script:
    - docker pull $TEST_IMAGE
    - docker ps -aq --filter name=$TEST_CONTAINER_NAME | grep -q . && docker stop $TEST_CONTAINER_NAME && docker rm $TEST_CONTAINER_NAME
    - docker run -d -p 127.0.0.1:8365:8080 -v ${TEST_RUNTIME_PROPERTIES}:/opt/local.runtime.properties --name $TEST_CONTAINER_NAME $TEST_IMAGE
  tags:
    - qs1-server
  when: manual

Deploy on prod server:
  stage: deploy
  script:
    - docker pull $PROD_IMAGE
    - docker ps -aq --filter name=$PROD_CONTAINER_NAME | grep -q . && docker stop $PROD_CONTAINER_NAME && docker rm $PROD_CONTAINER_NAME
    - docker run -d -p 127.0.0.1:8190:8080 -v ${PROD_HPT_RUNTIME_PROPERTIES}:/opt/local.runtime.properties --name $PROD_CONTAINER_NAME $PROD_IMAGE
  tags:
    - hpl-prod
  when: manual


Deploy on Wrocław ON prod server:
  stage: deploy
  script:
    - docker pull $PROD2_IMAGE
    - docker ps -aq --filter name=$PROD2_CONTAINER_NAME | grep -q . && docker stop $PROD2_CONTAINER_NAME && docker rm $PROD2_CONTAINER_NAME
    - docker run -d -p 127.0.0.1:8580:8080 -v ${PROD2_HPT_RUNTIME_PROPERTIES}:/opt/local.runtime.properties --name $PROD2_CONTAINER_NAME $PROD2_IMAGE
  tags:
    - hpl-prod
  when: manual
